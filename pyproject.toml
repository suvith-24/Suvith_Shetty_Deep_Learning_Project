
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexisyncai"
version = "0.1.0"
description = "Evidence-grounded legal document analyst"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF==2.1",
    "streamlit==1.67.0",
    "rank-bm25==0.2.2",
    "faiss-cpu==1.16.0",
    "python-dotenv==1.2.4",
    "sentence-transformers==6.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
